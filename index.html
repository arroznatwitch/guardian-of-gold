<canvas id="c" width="800" height="500"></canvas>
<script>
'use strict';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const H = 500, UW = 800; let W = 800, UIOX = 0, vign = null;

/* ---------- ecrã adaptável (ocupa a janela toda, mantém proporção) ---------- */
function makeVign() {
  vign = document.createElement('canvas'); vign.width = W; vign.height = H; const x = vign.getContext('2d');
  const g = x.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, Math.max(W, H) * .75); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.55)'); x.fillStyle = g; x.fillRect(0, 0, W, H);
}
function resize() {
  const dpr = window.devicePixelRatio || 1, iw = innerWidth > 50 ? innerWidth : 800, ih = innerHeight > 50 ? innerHeight : 500, asp = iw / ih;
  W = Math.round(Math.max(UW, Math.min(1400, H * asp))); UIOX = (W - UW) / 2;   // o mundo estica para preencher o ecra
  const sc = Math.min(iw / W, ih / H), cw = Math.max(1, Math.floor(W * sc)), ch = Math.max(1, Math.floor(H * sc));
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  cv.width = Math.floor(cw * dpr); cv.height = Math.floor(ch * dpr); makeVign();
}
addEventListener('resize', resize); resize();
function toggleFS() {
  try { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); } catch (e) {}
}

function mkStaffHead(kind, tier) {
  const t = tier || 1, big = t - 1, W = 16 + big * 2, H = 9 + big * 2, R = 2.6 + big * .85, cx = W - 5 - big, cy = (H - 1) / 2;
  const sh = t === 1 ? 's' : 'H', mn = t === 1 ? 'o' : 'O', hi = t === 1 ? 'h' : 'L', g = Array.from({ length: H }, () => Array(W).fill('.'));
  const put = (x, y, c) => { x = Math.round(x); y = Math.round(y); if (x >= 0 && y >= 0 && x < W && y < H) g[y][x] = c; };
  const disc = (px, py, r, c) => { for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if ((x - px) ** 2 + (y - py) ** 2 <= r * r) g[y][x] = c; };
  for (let x = 0; x <= cx - R + 1; x++) put(x, cy, sh);

    disc(cx - 1, cy + .5, R, mn); const L = 2 + big;
    for (let i = 1; i <= L; i++) { const half = R * (1 - i / (L + 1.5)); for (let y = Math.ceil(cy - half); y <= Math.floor(cy + half); y++) put(cx - 1 + R + i - .5, y - (i >= L ? 1 : 0), mn); }
    put(cx - 3, cy - R - 1, mn); put(cx - 1, cy - R - 2 - big * .5, mn); put(cx + 1, cy - R - 1, mn);
    disc(cx - 1.5, cy + .5, R * .5, hi);
  } else if (kind === 'ice') {      // cristal com duas lascas
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (Math.abs(x - cx) / (R + 2) + Math.abs(y - cy) / (R + .4) <= 1) g[y][x] = mn;
    const sx = cx - 2, k = 1.4 + big * .5;
    for (const dy of [-1, 1]) for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (Math.abs(x - sx) / (k + .6) + Math.abs(y - (cy + dy * (R + 1))) / (k + 1) <= 1) g[y][x] = mn;
    for (let x = cx - R + 1; x <= cx + R; x++) put(x, cy, hi); put(cx - 1, cy - 1, hi);
  } else if (kind === 'bolt') {     // estrela de faiscas
    disc(cx, cy, R * .62, mn); const A = Math.floor(R + 2);
    for (let k = 1; k <= A; k++) { put(cx + k, cy, mn); put(cx - k, cy, mn); put(cx, cy + k, mn); put(cx, cy - k, mn); }
    for (let k = 1; k <= Math.floor(R); k++) { put(cx + k, cy + k, mn); put(cx - k, cy + k, mn); put(cx + k, cy - k, mn); put(cx - k, cy - k, mn); }

function playOverlay() {

}

  const arrow = (fill, line) => ctx2 => { ARROW.forEach((r, y) => [...r].forEach((ch, x) => { if (ch === '.') return; ctx2.fillStyle = ch === 'X' ? line : fill; ctx2.fillRect(x * 2, y * 2, 2, 2); })); };
  const aim = ctx2 => {
    ctx2.fillStyle = '#1a1208'; ctx2.fillRect(14, 1, 5, 11); ctx2.fillRect(14, 21, 5, 11); ctx2.fillRect(1, 14, 11, 5); ctx2.fillRect(21, 14, 11, 5); ctx2.fillRect(13, 13, 7, 7);
    ctx2.fillStyle = '#fff'; ctx2.fillRect(15, 2, 3, 9); ctx2.fillRect(15, 22, 3, 9); ctx2.fillRect(2, 15, 9, 3); ctx2.fillRect(22, 15, 9, 3);
    ctx2.fillStyle = '#ffd34a'; ctx2.fillRect(15, 15, 3, 3);
  };
  return { arrow: mk(26, 34, arrow('#fff4c8', '#3a2a10'), 0, 0), hand: mk(26, 34, arrow('#ffd34a', '#3a2a10'), 0, 0), aim: mk(33, 33, aim, 16, 16) };
})();
let last = performance.now();
let frameErr = 0;
function frame(now) {
  requestAnimationFrame(frame);   // o proximo fotograma e pedido logo: uma falha pontual nunca para o jogo
  try {
  const dt = Math.min(.05, (now - last) / 1000); last = now; T += dt;
  const k = cv.width / W; ctx.setTransform(k, 0, 0, k, 0, 0); ctx.imageSmoothingEnabled = false;
  ui = []; confirmTick(dt); cv.style.cursor = state === 'play' ? CUR.aim : CUR.arrow; updateAnvil(dt); updateEnchant(dt); updateFuse(dt); updateUnlock(dt); if (state === 'hub') checkUnlocks(); if (state === 'hub' && window.__skRef) { const r = window.__skRef; window.__skRef = null; hubToast = { t: 7, s: T2('Skins reembolsadas: ', 'Skins refunded: ') + (r[0] ? '¢' + gfmt(r[0]) + ' ' : '') + (r[1] ? '◆' + r[1] : ''), col: '#ffd34a' }; } if (chestAnim > 0) chestAnim -= dt; if (save && save.gold > GOLD_MAX) save.gold = GOLD_MAX;
  if (state === 'play') for (let i = 0; i < gameSpeed && state === 'play'; i++) { sfxQuiet = i > 0; update(dt * BASE_SPD); } sfxQuiet = false;
  if (ONLINE_URL && !on.token && ['menu', 'class', 'keys', 'hub', 'options', 'sync', 'syncerr', 'conflict'].includes(state)) state = 'login';
  if (['menu', 'class', 'keys', 'hub', 'options', 'login', 'sync', 'syncerr', 'conflict'].includes(state)) { ctx.save(); ctx.translate(UIOX, 0); ({ menu: () => { drawMenu(); menuAccount(); }, class: drawClass, keys: drawKeys, hub: () => { drawHub(); drawGuildProfile(); drawProfile(); drawFarmInfo(); drawPresAsk(); drawPetRename(); drawSellAsk(); drawBagBuy(); drawCharCreate(); drawUnlock(); }, options: drawOptions, login: drawLogin, sync: drawSync, syncerr: drawSync, conflict: drawConflict })[state](); drawCountryPicker(); ctx.restore(); }
  else drawPlayScreens();
  if (muted) txt('MUDO (M)', W - 10, H - 8, 12, '#888', 'right');
    frameErr = 0;
  } catch (e) {
    frameErr++; sfxQuiet = false; mdown = false; try { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; } catch (e2) {}
    if (frameErr === 1) { try { console.error(e); } catch (e3) {} window.__lastErr = String(e && e.message || e); }

      hubToast = { t: 4, s: 'Erro recuperado: ' + (window.__lastErr || ''), col: '#f88' };
    }
  }
}

requestAnimationFrame(frame);
