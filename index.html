  const dpr = window.devicePixelRatio || 1, iw = innerWidth > 50 ? innerWidth : 800, ih = innerHeight > 50 ? innerHeight : 500, asp = iw / ih;

  cv.width = Math.floor(cw * dpr); cv.height = Math.floor(ch * dpr); makeVign();
}

    if (b.st === 'walk') {

  }

  // armadilhas
  for (const tr of R.traps) {
    tr.t -= dt;

  }

  for (const o of p.orbPts) { ctx.fillStyle = '#a4f'; ctx.beginPath(); ctx.arc(o.x, o.y, 9, 0, 7); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(o.x, o.y, 4, 0, 7); ctx.fill(); }

    if (q.kind === 'arrow') { ctx.strokeStyle = q.burn ? '#fa5' : '#e8d9a8'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(8, 0); ctx.stroke(); ctx.fillStyle = '#ccc'; ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(6, -4); ctx.lineTo(6, 4); ctx.fill(); }

    else { ctx.fillStyle = q.col; ctx.globalAlpha = .9; ctx.beginPath(); ctx.arc(0, 0, 7, 0, 7); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 3, 0, 7); ctx.fill(); }

  }
  for (const f of R.fx) {

function cdBar(y, key, name, cd, max, ready, col) {

/* =====================================================================

let last = performance.now();
